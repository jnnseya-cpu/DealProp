# Auto-deploy (publish half).
#
# The gate is the point: nothing is published unless the same suite CI runs has
# passed here first, against a real Postgres. A red build stops at `verify` and
# the image is never pushed, so a broken commit cannot go live.
#
# Two jobs, in order:
#   verify — types + the full suite against Postgres (production's engine).
#   deploy — build the image and push it to GHCR (tagged :latest and :sha).
#
# The VPS deploys itself, pull-based: /srv/lode/auto-deploy.sh runs on cron,
# compares the running image to :latest, and `docker compose pull && up -d
# --force-recreate` only when it changed. So this file verifies and publishes;
# the box does the rest within ~2 minutes. Nothing here touches the engines or
# the money path; it ships the image the Dockerfile already produces.

name: Deploy

on:
  push:
    branches:
      - claude/property-deal-os-a4bclq
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lode
          POSTGRES_PASSWORD: lode
          POSTGRES_DB: lode_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests, both storage engines
        run: npm run test:pg
        env:
          TEST_DATABASE_URL: postgres://lode:lode@127.0.0.1:5432/lode_test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The public site URL is the only build arg the image needs; the
          # statutory identity and every secret are read at runtime from the
          # VPS's app.env, never baked into a layer.
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://www.lodeprop.com
          tags: |
            ghcr.io/jnnseya-cpu/dealprop:latest
            ghcr.io/jnnseya-cpu/dealprop:${{ github.sha }}

      # The VPS deploys itself: /srv/lode/auto-deploy.sh runs on cron, and once
      # the new :latest is here it pulls and force-recreates within two minutes.
      # So this workflow's job is to verify and publish — nothing SSHes into the
      # box, which is why every run is green rather than failing on a deploy step
      # that needed credentials the box pulls with instead.
